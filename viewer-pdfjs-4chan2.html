<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PDF Random Page Viewer (Auto-Range + ChatGPT Launch)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100svh; display: grid; place-items: center;
      background:#f2f2f2; transition: background .6s ease;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .paper {
      width:min(100%, 980px);
      background:#fff;
      border-radius: 18px; box-shadow:0 4px 12px rgba(0,0,0,.1);
      padding: 2rem;
    }
  </style>
</head>
<body>
<main class="paper">
  <h1 class="mb-3">PDF Random Page Viewer</h1>
  <p class="text-secondary">Use <code>?fileName=1.pdf</code>. Then click “Copy page text” to send it to ChatGPT.</p>
  <div id="status" class="mb-2">Loading…</div>
  <p><strong>File:</strong> <span id="file"></span> | <strong>Pages:</strong> <span id="count"></span> | Current page: <span id="currentPage">—</span></p>
  <div class="mb-3">
    <button id="reroll" class="btn btn-primary btn-sm">Random page</button>
    <button id="copyTextBtn" class="btn btn-success btn-sm">📋 Copy page text + launch ChatGPT</button>
  </div>
  <canvas id="pdfCanvas" style="width:100%;background:white;border-radius:8px;"></canvas>
</main>

<script type="module">
import { getDocument, GlobalWorkerOptions } from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.mjs";
GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.worker.mjs";

const $ = s => document.querySelector(s);
const statusEl = $("#status"), fileEl = $("#file"), countEl = $("#count"), currentEl = $("#currentPage");
const copyBtn = $("#copyTextBtn"), rerollBtn = $("#reroll"), canvas = $("#pdfCanvas"), ctx = canvas.getContext("2d");

let pdf=null, total=0, current=1;
const params = new URLSearchParams(location.search);
const rawFile = params.get("fileName");

function sanitizePdfName(name) {
  if (!name) return null;
  const s = decodeURIComponent(name).trim();
  if (!/^[A-Za-z0-9._-]+\.pdf$/i.test(s)) return null;
  return s;
}

function fail(msg){ statusEl.style.color="red"; statusEl.textContent=msg; }
function ok(msg){ statusEl.style.color="green"; statusEl.textContent=msg; }

function randomInt(min,max){ const r=new Uint32Array(1);crypto.getRandomValues(r);return min+Math.floor((r[0]/2**32)*(max-min+1)); }

async function renderPage(n){
  if(!pdf) return;
  const page=await pdf.getPage(n);
  const vp=page.getViewport({scale:1.5});
  canvas.width=vp.width; canvas.height=vp.height;
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  current=n;
  currentEl.textContent=n;
}

async function loadPdf(name){
  const safe=sanitizePdfName(name);
  if(!safe){ fail("Invalid ?fileName parameter."); throw new Error("invalid name"); }
  const url=new URL("./"+safe,location.href);
  statusEl.textContent="Fetching "+safe+"…";
  const doc=getDocument(url.href);
  pdf=await doc.promise;
  total=pdf.numPages;
  fileEl.textContent=safe;
  countEl.textContent=total;
  ok("Loaded successfully.");
  await renderPage(randomInt(1,total));
}

rerollBtn.addEventListener("click",()=>renderPage(randomInt(1,total)));

async function extractCurrentPageText(){
  if(!pdf) throw new Error("PDF not loaded");
  const page=await pdf.getPage(current);
  const text=await page.getTextContent();
  const joined=text.items.map(i=>i.str).join(" ").replace(/\s+/g," ").trim();
  return joined;
}

// ✅ MODIFIED: prefix and auto-launch ChatGPT
copyBtn.addEventListener("click",async()=>{
  const orig=copyBtn.innerHTML;
  try{
    const raw=await extractCurrentPageText();
    const prefixed=`4chan: explain this ${raw}`;
    await navigator.clipboard.writeText(prefixed);
    window.open(`https://chat.openai.com/?q=${encodeURIComponent(prefixed)}`,"_blank");
    copyBtn.classList.replace("btn-success","btn-outline-success");
    copyBtn.innerHTML="✅ Copied & launched!";
    setTimeout(()=>{copyBtn.classList.replace("btn-outline-success","btn-success");copyBtn.innerHTML=orig;},2000);
  }catch(e){
    console.error(e);
    fail("Copy or ChatGPT launch failed");
  }
});

(async()=>{
  try{
    if(!rawFile) throw new Error("Missing ?fileName param");
    await loadPdf(rawFile);
  }catch(e){
    console.error(e);
    fail("Failed: "+(e.message||e));
  }
})();
</script>
</body>
</html>
