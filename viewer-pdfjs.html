<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PDF Random Page Viewer (Auto-Range, Styled + Autocycle)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --paper-bg:#fff; --paper-shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08); }
    body {
      min-height: 100svh; display: grid; place-items: center;
      background:#f2f2f2; transition: background .6s ease;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .paper {
      width:min(100%, 980px);
      background:
        radial-gradient(1200px 800px at 50% 20%, rgba(255,255,255,.75), rgba(255,255,255,.9)),
        repeating-linear-gradient(0deg, rgba(0,0,0,.015) 0px, rgba(0,0,0,.015) 1px, transparent 1px, transparent 6px),
        var(--paper-bg);
      border-radius: 18px; box-shadow: var(--paper-shadow);
      padding: 2rem; border: 1px solid rgba(0,0,0,.05); backdrop-filter: blur(1px);
    }
    h1 { font-weight:700; margin-bottom:.5rem; }
    .muted { opacity:.75; }
    .tag { font-size:.8rem; padding:.15rem .5rem; border:1px solid #e5e7eb; border-radius:.4rem; background:#fff; }
    #pdfCanvas { width:100%; height:auto; display:block; background:#fff; border-radius:8px;
      box-shadow:0 0 0 1px #eee, 0 2px 8px rgba(0,0,0,.05); }
    #status.err{color:#b02a37} #status.ok{color:#0a7a2e}
    .control-row { gap:.5rem; }
    .form-control-sm { min-width:6rem; }
    .btn-icon { display:inline-flex; align-items:center; gap:.4rem; }
  </style>
</head>
<body>
  <main class="paper">
    <header class="mb-2 d-flex flex-wrap align-items-center gap-2">
      <h1 class="mb-0">PDF Random Page Viewer</h1>
      <span class="badge bg-secondary-subtle text-secondary-emphasis">Auto-Range</span>
      <span id="bgTag" class="tag ms-auto">Background: —</span>
    </header>
    <p class="text-secondary">Use <code>?fileName=1.pdf</code>. The viewer infers a main page range and initializes on a random page in that range.</p>

    <div id="status" class="mb-2">Loading…</div>

    <section id="meta" hidden>
      <p class="d-flex flex-wrap align-items-center gap-2">
        <strong>File:</strong><span id="file"></span>
        <span class="muted">|</span>
        <strong>Pages:</strong><span id="count"></span>
        <span class="muted">|</span>
        <span class="tag">Range <span id="rangeView"></span></span>
        <span class="muted">|</span>
        <a id="openAtLink" target="_blank" rel="noopener" class="link-primary">Open in browser at this page</a>
      </p>

      <div class="control-row d-flex flex-wrap align-items-center mb-3">
        <div class="form-check me-2">
          <input class="form-check-input" type="checkbox" id="useInferred" checked>
          <label class="form-check-label" for="useInferred">Use inferred main range</label>
        </div>

        <!-- Min locked to 1 -->
        <div class="input-group input-group-sm me-2" style="width:10.5rem;">
          <span class="input-group-text">Min</span>
          <input id="minPage" class="form-control form-control-sm" value="1" disabled />
        </div>
        <div class="input-group input-group-sm me-2" style="width:10.5rem;">
          <span class="input-group-text">Max</span>
          <input id="maxPage" type="number" min="1" step="1" class="form-control form-control-sm" />
        </div>

        <button id="applyRange" class="btn btn-outline-primary btn-sm">Apply range</button>
        <button id="resetToInferred" class="btn btn-outline-secondary btn-sm" title="Reset inputs to inferred range">Reset</button>
        <button id="reroll" class="btn btn-primary btn-sm ms-1">Reroll random page</button>
        <button id="prev" class="btn btn-outline-dark btn-sm ms-1">Prev</button>
        <button id="next" class="btn btn-outline-dark btn-sm">Next</button>

        <div class="input-group input-group-sm ms-auto" style="width:12rem;">
          <span class="input-group-text">Zoom</span>
          <input id="zoom" type="number" step="0.1" min="0.2" max="3" value="1.0" class="form-control form-control-sm" />
          <button id="applyZoom" class="btn btn-outline-dark btn-sm">Apply</button>
        </div>

        <span class="ms-2 text-secondary">Current: <strong>#<span id="currentPage">—</span></strong></span>
      </div>

      <div class="d-flex flex-wrap gap-2 mb-3">
        <button id="randomFileBtn" class="btn btn-warning btn-sm btn-icon" title="Pick a random file X.pdf between 1 and N (current N.pdf)">
          <span>🎲</span><span>Random file (1..N).pdf</span>
        </button>
        <button id="copyTextBtn" class="btn btn-success btn-sm btn-icon" title="Copy all text on the current page">
          <span>📋</span><span>Copy page text</span>
        </button>
      </div>

      <!-- Auto-cycle controls -->
      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="autoCycleToggle">
          <label class="form-check-label" for="autoCycleToggle">Auto-cycle random page</label>
        </div>
        <div class="input-group input-group-sm" style="width:12rem;">
          <span class="input-group-text">Every</span>
          <input id="autoCycleSecs" type="number" min="2" step="1" value="10" class="form-control form-control-sm">
          <span class="input-group-text">sec</span>
        </div>
        <button id="applyAutoCycle" class="btn btn-outline-success btn-sm">Apply</button>
        <span id="autoCycleStatus" class="text-secondary ms-1">Off</span>
      </div>
    </section>

    <div id="canvasWrap">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </main>

  <script type="module">
    /* ======= Core libs (unchanged) ======= */
    import { getDocument, GlobalWorkerOptions } from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.mjs";
    GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.worker.mjs";

    /* ======= IndexedDB Caching ======= */
    const DB_NAME = 'pdfCacheDB';
    const DB_VERSION = 1;
    const PDF_STORE_NAME = 'pdfs';

    // Open IndexedDB database
    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject('Error opening IndexedDB');
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains(PDF_STORE_NAME)) {
            db.createObjectStore(PDF_STORE_NAME, { keyPath: 'filename' });
          }
        };
      });
    }

    // Save PDF file to IndexedDB
    function savePdfToIndexedDB(db, filename, pdfData) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([PDF_STORE_NAME], 'readwrite');
        const store = transaction.objectStore(PDF_STORE_NAME);
        const pdfRecord = { filename, pdfData };
        const request = store.put(pdfRecord);
        request.onsuccess = () => resolve();
        request.onerror = () => reject('Error saving PDF to IndexedDB');
      });
    }

    // Get PDF file from IndexedDB
    function getPdfFromIndexedDB(db, filename) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction([PDF_STORE_NAME], 'readonly');
        const store = transaction.objectStore(PDF_STORE_NAME);
        const request = store.get(filename);
        request.onsuccess = () => {
          if (request.result) {
            resolve(request.result.pdfData);
          } else {
            resolve(null);
          }
        };
        request.onerror = () => reject('Error retrieving PDF from IndexedDB');
      });
    }

    async function loadPdfByFileName(newFileName){
      const safe = sanitizePdfName(newFileName);
      if (!safe) throw new Error("Invalid filename");
      fileName = safe;
      pdfUrl = new URL("./" + fileName, location.href).toString();

      statusEl.textContent = "Checking cache for " + fileName + "…";
      const db = await openDatabase();
      const cachedPdf = await getPdfFromIndexedDB(db, fileName);

      if (cachedPdf) {
        statusEl.textContent = "Loaded PDF from cache.";
        pdf = await getDocument({ data: cachedPdf }).promise;
      } else {
        statusEl.textContent = "Fetching " + fileName + " from network…";
        const task = getDocument({ url: pdfUrl });
        pdf = await task.promise;
        const pdfData = await task.promise;
        savePdfToIndexedDB(db, fileName, pdfData);
      }

      total = pdf.numPages;
      let labels = null;
      try { labels = await pdf.getPageLabels(); } catch {}
      const guessed = inferMainRangeFromLabels(labels, total) ?? { min:1, max: total };
      inferred = { min:1, max: guessed.max }; // enforce min=1

      fileEl.textContent = fileName;
      countEl.textContent = String(total);
      setRangeInputs(inferred.min, inferred.max);
      metaEl.hidden = false;

      ok("Loaded successfully.");
      const start = randomInt(inferred.min, inferred.max);
      await renderPage(start);

      const u = new URL(location.href);
      u.searchParams.set("fileName", fileName);
      history.replaceState({}, "", u.toString());
    }

    /* ======= Boot ======= */
    (async () => {
      await hydratePantone();
      setRandomPantoneBackground(); // on load
      try { await loadPdfByFileName(fileName); }
      catch (err) {
        console.error(err);
        fail(String(err?.message || "Error loading PDF"));
      }
    })();

    /* ======= Controls ======= */
    $("#reroll").addEventListener("click", async () => {
      setRandomPantoneBackground();
      const { min, max } = getActiveRange();
      await renderPage(randomInt(min, max));
    });
    $("#prev").addEventListener("click", async () => { await renderPage(current - 1); });
    $("#next").addEventListener("click", async () => { await renderPage(current + 1); });

    $("#applyRange").addEventListener("click", async () => {
      useInferredChk.checked = false;
      const { min, max } = getActiveRange(); // min always 1
      setRangeInputs(min, max);
      const u = new URL(location.href);
      u.searchParams.set("minPage", "1");
      u.searchParams.set("maxPage", String(max));
      history.replaceState({}, "", u.toString());
      await renderPage(randomInt(min, max));
    });

    $("#resetToInferred").addEventListener("click", async () => {
      useInferredChk.checked = true;
      setRangeInputs(inferred.min, inferred.max);
      const u = new URL(location.href);
      u.searchParams.delete("minPage");
      u.searchParams.delete("maxPage");
      history.replaceState({}, "", u.toString());
      await renderPage(randomInt(inferred.min, inferred.max));
    });

    $("#applyZoom").addEventListener("click", async () => {
      const z = Number(zoomInput.value);
      if (Number.isFinite(z) && z >= 0.2 && z <= 3) { zoom = z; await renderPage(current); }
    });
  </script>
</body>
</html>
