<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PDF Random Page Viewer (Auto-Range, Styled)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <style>
    :root {
      --paper-bg: #fff;
      --paper-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
    }
    /* Center everything */
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #f2f2f2; /* will be replaced by Pantone on load/reroll */
      transition: background-color .6s ease, background .6s ease;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    /* Paper-like container */
    .paper {
      width: min(100%, 980px);
      background:
        radial-gradient(1200px 800px at 50% 20%, rgba(255,255,255,.75), rgba(255,255,255,.9)),
        repeating-linear-gradient(0deg, rgba(0,0,0,.015) 0px, rgba(0,0,0,.015) 1px, transparent 1px, transparent 6px),
        var(--paper-bg);
      border-radius: 18px;
      box-shadow: var(--paper-shadow);
      padding: 2rem;
      border: 1px solid rgba(0,0,0,.05);
      backdrop-filter: blur(1px);
    }
    h1 {
      font-weight: 700;
      letter-spacing: .2px;
      margin-bottom: .5rem;
    }
    .muted { opacity: .75; }
    .tag {
      font-size: .8rem; padding: .15rem .5rem;
      border: 1px solid #e5e7eb; border-radius: .4rem; background: #fff;
    }
    #canvasWrap { width: 100%; }
    #pdfCanvas {
      width: 100%; height: auto; display: block; background: #fff;
      box-shadow: 0 0 0 1px #eee, 0 2px 8px rgba(0,0,0,.05);
      border-radius: 8px;
    }
    #status.err { color: #b02a37; }
    #status.ok  { color: #0a7a2e; }
    .control-row { gap: .5rem; }
    .form-control-sm { min-width: 6rem; }
  </style>
</head>
<body>
  <main class="paper">
    <header class="mb-2 d-flex flex-wrap align-items-center gap-2">
      <h1 class="mb-0">PDF Random Page Viewer</h1>
      <span class="badge bg-secondary-subtle text-secondary-emphasis">Auto-Range</span>
      <span id="bgTag" class="tag ms-auto">Background: —</span>
    </header>
    <p class="text-secondary">Use <code>?fileName=1.pdf</code>. The viewer **infers a main page range** from labels and initializes on a **random page** in that range.</p>

    <div id="status" class="mb-2">Loading…</div>

    <section id="meta" hidden>
      <p class="d-flex flex-wrap align-items-center gap-2">
        <strong>File:</strong><span id="file"></span>
        <span class="muted">|</span>
        <strong>Pages:</strong><span id="count"></span>
        <span class="muted">|</span>
        <span class="tag">Range <span id="rangeView"></span></span>
        <span class="muted">|</span>
        <a id="openAtLink" target="_blank" rel="noopener" class="link-primary">Open in browser at this page</a>
      </p>

      <div class="control-row d-flex flex-wrap align-items-center mb-3">
        <div class="form-check me-2">
          <input class="form-check-input" type="checkbox" id="useInferred" checked>
          <label class="form-check-label" for="useInferred">Use inferred main range</label>
        </div>

        <div class="input-group input-group-sm me-2" style="width: 10.5rem;">
          <span class="input-group-text">Min</span>
          <input id="minPage" type="number" min="1" step="1" class="form-control form-control-sm" />
        </div>
        <div class="input-group input-group-sm me-2" style="width: 10.5rem;">
          <span class="input-group-text">Max</span>
          <input id="maxPage" type="number" min="1" step="1" class="form-control form-control-sm" />
        </div>

        <button id="applyRange" class="btn btn-outline-primary btn-sm">Apply range</button>
        <button id="resetToInferred" class="btn btn-outline-secondary btn-sm" title="Reset inputs to inferred range">Reset</button>
        <button id="reroll" class="btn btn-primary btn-sm ms-1">Reroll random page</button>
        <button id="prev" class="btn btn-outline-dark btn-sm ms-1">Prev</button>
        <button id="next" class="btn btn-outline-dark btn-sm">Next</button>

        <div class="input-group input-group-sm ms-auto" style="width: 12rem;">
          <span class="input-group-text">Zoom</span>
          <input id="zoom" type="number" step="0.1" min="0.2" max="3" value="1.0" class="form-control form-control-sm" />
          <button id="applyZoom" class="btn btn-outline-dark btn-sm">Apply</button>
        </div>

        <span class="ms-2 text-secondary">Current: <strong>#<span id="currentPage">—</span></strong></span>
      </div>
    </section>

    <div id="canvasWrap">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </main>

  <script type="module">
    /* ========= KEEPING YOUR EXISTING LOGIC, JUST STYLES + BG COLOR HOOKS ========= */

    // PDF.js (ESM) via CDN — pinned
    import { getDocument, GlobalWorkerOptions } from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.mjs";
    GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.worker.mjs";

    const $ = s => document.querySelector(s);
    const statusEl = $("#status");
    const metaEl = $("#meta");
    const fileEl = $("#file");
    const countEl = $("#count");
    const currentEl = $("#currentPage");
    const rangeView = $("#rangeView");
    const openAtLink = $("#openAtLink");
    const useInferredChk = $("#useInferred");
    const minInput = $("#minPage");
    const maxInput = $("#maxPage");
    const rerollBtn = $("#reroll");
    const prevBtn = $("#prev");
    const nextBtn = $("#next");
    const applyRangeBtn = $("#applyRange");
    const resetToInferredBtn = $("#resetToInferred");
    const zoomInput = $("#zoom");
    const applyZoomBtn = $("#applyZoom");
    const canvas = $("#pdfCanvas");
    const ctx = canvas.getContext("2d");
    const bgTag = $("#bgTag");

    // --- URL params (unchanged) ---
    const params = new URLSearchParams(location.search);
    const rawFile = params.get("fileName");

    function sanitizePdfName(name) {
      if (!name) return null;
      const s = decodeURIComponent(name).trim();
      if (/[\\\/]/.test(s) || /[\x00-\x1F]/.test(s)) return null;
      if (!/^[A-Za-z0-9._-]+$/i.test(s)) return null;
      if (!/\.pdf$/i.test(s)) return null;
      return s;
    }

    function fail(msg) { statusEl.className="err"; statusEl.textContent=msg; }
    function ok(msg)   { statusEl.className="ok"; statusEl.textContent=msg; }

    const fileName = sanitizePdfName(rawFile);
    if (!fileName) {
      fail("** Missing or invalid ?fileName param. Example: ?fileName=1.pdf **");
      throw new Error("Invalid fileName");
    }
    const pdfUrl = new URL("./" + fileName, location.href).toString();

    // Crypto-safe random int in [lo, hi]
    function randomInt(lo, hi) {
      if (hi < lo) [lo, hi] = [hi, lo];
      const span = hi - lo + 1;
      const buf = new Uint32Array(1);
      let x;
      do { crypto.getRandomValues(buf); x = buf[0] / 2 ** 32; } while (x === 1);
      return lo + Math.floor(x * span);
    }

    // Infer Arabic-labeled continuous run 1..K
    function inferMainRangeFromLabels(labels, total) {
      if (!Array.isArray(labels) || labels.length !== total) return null;
      const parseArabic = (lab) => {
        const m = String(lab ?? "").match(/(^|[^0-9])([0-9]+)($|[^0-9])/);
        if (!m) return null;
        return Number(m[2]);
      };
      let startIdx = -1;
      for (let i = 0; i < total; i++) {
        const n = parseArabic(labels[i]);
        if (n === 1) { startIdx = i; break; }
      }
      if (startIdx === -1) return null;
      let expected = 1, endIdx = startIdx;
      for (let i = startIdx; i < total; i++) {
        const n = parseArabic(labels[i]);
        if (n === expected) { endIdx = i; expected++; } else break;
      }
      return { min: startIdx + 1, max: endIdx + 1 };
    }

    let pdf = null;
    let total = 0;
    let current = 1;
    let zoom = 1.0;
    let inferred = null; // {min,max} or null

    function setRangeInputs(min, max) {
      minInput.value = String(min);
      maxInput.value = String(max);
      rangeView.textContent = `${min}–${max}`;
    }
    function getActiveRange() {
      const def = inferred ?? { min: 1, max: total };
      if (useInferredChk.checked) return def;
      let min = Number(minInput.value || def.min);
      let max = Number(maxInput.value || def.max);
      if (!Number.isFinite(min) || min < 1) min = 1;
      if (!Number.isFinite(max) || max > total) max = total;
      if (min > max) [min, max] = [max, min];
      return { min, max };
    }

    async function renderPage(pageNumber) {
      if (!pdf) return;
      pageNumber = Math.max(1, Math.min(total, pageNumber));
      current = pageNumber;
      const page = await pdf.getPage(pageNumber);

      const baseVp = page.getViewport({ scale: 1 });
      const containerWidth = $("#canvasWrap").clientWidth;
      const fitScale = containerWidth / baseVp.width;
      const finalScale = fitScale * zoom;

      const vp = page.getViewport({ scale: finalScale });
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);

      const renderTask = page.render({ canvasContext: ctx, viewport: vp });
      await renderTask.promise;

      currentEl.textContent = String(current);
      openAtLink.href = `${pdfUrl}#page=${current}`;
      history.replaceState({}, "", (() => {
        const u = new URL(location.href);
        u.searchParams.set("page", String(current));
        return u.toString();
      })());
    }

    // ========= New: Random Pantone-ish background =========
    const PANTONE = [
      { name: "Pantone 290 C", hex: "#B9D9EB" },
      { name: "Pantone 2706 C", hex: "#BEC3FF" },
      { name: "Pantone 698 C",  hex: "#F4C3C2" },
      { name: "Pantone 7401 C", hex: "#F4E6B3" },
      { name: "Pantone 2260 C", hex: "#6DC5A4" },
      { name: "Pantone 7458 C", hex: "#7FB0C9" },
      { name: "Pantone 7604 C", hex: "#E3D9D6" },
      { name: "Pantone 1585 C", hex: "#FF7F32" },
      { name: "Pantone 7671 C", hex: "#7F6DAA" },
      { name: "Pantone 1205 C", hex: "#F6E39E" },
      { name: "Pantone 3242 C", hex: "#8CE3D6" },
      { name: "Pantone 5523 C", hex: "#BFD4CF" }
    ];
    function setRandomPantoneBackground() {
      const { name, hex } = PANTONE[randomInt(0, PANTONE.length - 1)];
      // Soft radial wash to mimic paper on color
      document.body.style.background = `
        radial-gradient(1200px 800px at 50% -10%, rgba(255,255,255,.35), rgba(255,255,255,0) 70%),
        ${hex}
      `;
      bgTag.textContent = `Background: ${name}`;
    }
    // ======================================================

    (async () => {
      try {
        setRandomPantoneBackground(); // on pageload
        statusEl.textContent = "Fetching " + fileName + "…";
        const task = getDocument({ url: pdfUrl });
        pdf = await task.promise;
        total = pdf.numPages;

        let labels = null;
        try { labels = await pdf.getPageLabels(); } catch {}
        inferred = inferMainRangeFromLabels(labels, total) ?? { min: 1, max: total };

        fileEl.textContent = fileName;
        countEl.textContent = String(total);
        setRangeInputs(inferred.min, inferred.max);
        metaEl.hidden = false;

        ok("Loaded successfully.");
        const start = randomInt(inferred.min, inferred.max);
        await renderPage(start);
      } catch (err) {
        console.error(err);
        if (String(err?.message || "").toLowerCase().includes("not found")) {
          fail("File not found: " + fileName);
        } else {
          fail("Couldn’t read PDF. Ensure the file exists here and is a valid PDF.");
        }
      }
    })();

    // Controls (unchanged functionality)
    rerollBtn.addEventListener("click", async () => {
      setRandomPantoneBackground(); // change background on reroll
      const { min, max } = getActiveRange();
      await renderPage(randomInt(min, max));
    });
    prevBtn.addEventListener("click", async () => { await renderPage(current - 1); });
    nextBtn.addEventListener("click", async () => { await renderPage(current + 1); });

    applyRangeBtn.addEventListener("click", async () => {
      useInferredChk.checked = false;
      const { min, max } = getActiveRange();
      setRangeInputs(min, max);
      const u = new URL(location.href);
      u.searchParams.set("minPage", String(min));
      u.searchParams.set("maxPage", String(max));
      history.replaceState({}, "", u.toString());
      await renderPage(randomInt(min, max));
    });

    resetToInferredBtn.addEventListener("click", async () => {
      useInferredChk.checked = true;
      setRangeInputs(inferred.min, inferred.max);
      const u = new URL(location.href);
      u.searchParams.delete("minPage");
      u.searchParams.delete("maxPage");
      history.replaceState({}, "", u.toString());
      await renderPage(randomInt(inferred.min, inferred.max));
    });

    applyZoomBtn.addEventListener("click", async () => {
      const z = Number(zoomInput.value);
      if (Number.isFinite(z) && z >= 0.2 && z <= 3) {
        zoom = z;
        await renderPage(current);
      }
    });

    addEventListener("resize", (() => {
      let t; return () => { clearTimeout(t); t = setTimeout(() => { if (pdf) renderPage(current); }, 150); };
    })());
  </script>
</body>
</html>
