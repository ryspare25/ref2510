<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PDF Random Page Viewer (Auto-Range)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 1.5rem; }
    .ok { color: #0a0; }
    .err { color: #b00; }
    code { background: #f6f8fa; padding: .1rem .3rem; border-radius: .25rem; }
    .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .controls { display: flex; gap: .5rem; align-items: center; margin: .75rem 0 1rem; flex-wrap: wrap; }
    button { padding: .5rem .8rem; border: 1px solid #ccc; border-radius: .5rem; background: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #canvasWrap { width: min(100%, 900px); }
    #pdfCanvas { width: 100%; height: auto; display: block; background: #fff; box-shadow: 0 0 0 1px #eee, 0 2px 8px rgba(0,0,0,.05); }
    label { font-size: .9rem; opacity: .9; }
    input[type="number"] { width: 6rem; padding: .35rem .45rem; }
    .muted { opacity: .75; }
    .tag { font-size: .8rem; padding: .15rem .4rem; border: 1px solid #ddd; border-radius: .4rem; }
  </style>
</head>
<body>
  <h1>PDF Random Page Viewer (Auto-Range)</h1>
  <p>Use <code>?fileName=1.pdf</code>. The viewer **_infers a main page range_** from PDF page labels and initializes on a **_random page_** within that range.</p>

  <div id="status">Loading…</div>

  <div id="meta" hidden>
    <p class="row">
      <strong>File:</strong>&nbsp;<span id="file"></span>
      <span class="muted">|</span>
      <strong>Pages:</strong>&nbsp;<span id="count"></span>
      <span class="muted">|</span>
      <span class="tag">Range <span id="rangeView"></span></span>
      <span class="muted">|</span>
      <a id="openAtLink" target="_blank" rel="noopener">Open in browser at this page</a>
    </p>

    <div class="controls">
      <label><input id="useInferred" type="checkbox" checked /> Use inferred main range</label>
      <label>Min:&nbsp;<input id="minPage" type="number" min="1" step="1" /></label>
      <label>Max:&nbsp;<input id="maxPage" type="number" min="1" step="1" /></label>
      <button id="applyRange">Apply range</button>
      <button id="resetToInferred" title="Reset inputs to inferred range">Reset to inferred</button>
      <button id="reroll">Reroll random page</button>
      <button id="prev">Prev</button>
      <button id="next">Next</button>
      <label>Zoom:&nbsp;<input id="zoom" type="number" step="0.1" min="0.2" max="3" value="1.0" /></label>
      <button id="applyZoom">Apply zoom</button>
      <span class="muted">Current:&nbsp;<strong>#<span id="currentPage">—</span></strong></span>
    </div>
  </div>

  <div id="canvasWrap">
    <canvas id="pdfCanvas"></canvas>
  </div>

  <script type="module">
    // PDF.js ESM (pin a version)
    import { getDocument, GlobalWorkerOptions } from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.mjs";
    GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.worker.mjs";

    const $ = s => document.querySelector(s);
    const statusEl = $("#status");
    const metaEl = $("#meta");
    const fileEl = $("#file");
    const countEl = $("#count");
    const currentEl = $("#currentPage");
    const rangeView = $("#rangeView");
    const openAtLink = $("#openAtLink");
    const useInferredChk = $("#useInferred");
    const minInput = $("#minPage");
    const maxInput = $("#maxPage");
    const rerollBtn = $("#reroll");
    const prevBtn = $("#prev");
    const nextBtn = $("#next");
    const applyRangeBtn = $("#applyRange");
    const resetToInferredBtn = $("#resetToInferred");
    const zoomInput = $("#zoom");
    const applyZoomBtn = $("#applyZoom");
    const canvas = $("#pdfCanvas");
    const ctx = canvas.getContext("2d");

    // --- URL params ---
    const params = new URLSearchParams(location.search);
    const rawFile = params.get("fileName");

    // Simple filename sanitizer
    function sanitizePdfName(name) {
      if (!name) return null;
      const s = decodeURIComponent(name).trim();
      if (/[\\\/]/.test(s) || /[\x00-\x1F]/.test(s)) return null;
      if (!/^[A-Za-z0-9._-]+$/i.test(s)) return null;
      if (!/\.pdf$/i.test(s)) return null;
      return s;
    }

    function fail(msg) { statusEl.className="err"; statusEl.textContent=msg; }
    function ok(msg)   { statusEl.className="ok"; statusEl.textContent=msg; }

    const fileName = sanitizePdfName(rawFile);
    if (!fileName) {
      fail("** Missing or invalid ?fileName param. Example: ?fileName=1.pdf **");
      throw new Error("Invalid fileName");
    }
    const pdfUrl = new URL("./" + fileName, location.href).toString();

    // Crypto-safe random int in [lo, hi]
    function randomInt(lo, hi) {
      if (hi < lo) [lo, hi] = [hi, lo];
      const span = hi - lo + 1;
      const buf = new Uint32Array(1);
      let x;
      do { crypto.getRandomValues(buf); x = buf[0] / 2 ** 32; } while (x === 1);
      return lo + Math.floor(x * span);
    }

    // Detect the "main" Arabic-numbered run (1..K) from page labels
    function inferMainRangeFromLabels(labels, total) {
      if (!Array.isArray(labels) || labels.length !== total) return null;

      // Helper: parse Arabic integer label or return null (ignore prefixes like "A-12")
      const parseArabic = (lab) => {
        const m = String(lab ?? "").match(/(^|[^0-9])([0-9]+)($|[^0-9])/);
        if (!m) return null;
        return Number(m[2]);
      };

      // Find first page whose parsed Arabic == 1
      let startIdx = -1;
      for (let i = 0; i < total; i++) {
        const n = parseArabic(labels[i]);
        if (n === 1) { startIdx = i; break; }
      }
      if (startIdx === -1) return null;

      // Extend while labels increase by +1 contiguously
      let expected = 1;
      let endIdx = startIdx;
      for (let i = startIdx; i < total; i++) {
        const n = parseArabic(labels[i]);
        if (n === expected) { endIdx = i; expected++; }
        else break;
      }
      // Return 1-based page numbers
      return { min: startIdx + 1, max: endIdx + 1 };
    }

    let pdf = null;
    let total = 0;
    let current = 1;
    let zoom = 1.0;
    let inferred = null; // {min,max} or null

    function setRangeInputs(min, max) {
      minInput.value = String(min);
      maxInput.value = String(max);
      rangeView.textContent = `${min}–${max}`;
    }
    function getActiveRange() {
      const def = inferred ?? { min: 1, max: total };
      if (useInferredChk.checked) return def;
      let min = Number(minInput.value || def.min);
      let max = Number(maxInput.value || def.max);
      if (!Number.isFinite(min) || min < 1) min = 1;
      if (!Number.isFinite(max) || max > total) max = total;
      if (min > max) [min, max] = [max, min];
      return { min, max };
    }

    async function renderPage(pageNumber) {
      if (!pdf) return;
      pageNumber = Math.max(1, Math.min(total, pageNumber));
      current = pageNumber;
      const page = await pdf.getPage(pageNumber);

      const baseVp = page.getViewport({ scale: 1 });
      const containerWidth = $("#canvasWrap").clientWidth;
      const fitScale = containerWidth / baseVp.width;
      const finalScale = fitScale * zoom;

      const vp = page.getViewport({ scale: finalScale });
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);

      const renderTask = page.render({ canvasContext: ctx, viewport: vp });
      await renderTask.promise;

      currentEl.textContent = String(current);
      openAtLink.href = `${pdfUrl}#page=${current}`;
      history.replaceState({}, "", (() => {
        const u = new URL(location.href);
        u.searchParams.set("page", String(current));
        return u.toString();
      })());
    }

    (async () => {
      try {
        statusEl.textContent = "Fetching " + fileName + "…";
        const task = getDocument({ url: pdfUrl });
        pdf = await task.promise;
        total = pdf.numPages;

        // Try to infer range from page labels
        let labels = null;
        try { labels = await pdf.getPageLabels(); } catch {}
        inferred = inferMainRangeFromLabels(labels, total) ?? { min: 1, max: total };

        fileEl.textContent = fileName;
        countEl.textContent = String(total);
        setRangeInputs(inferred.min, inferred.max);
        metaEl.hidden = false;

        ok("Loaded successfully.");
        const start = randomInt(inferred.min, inferred.max);
        await renderPage(start);
      } catch (err) {
        console.error(err);
        if (String(err?.message || "").toLowerCase().includes("not found")) {
          fail("File not found: " + fileName);
        } else {
          fail("Couldn’t read PDF. Ensure the file exists here and is a valid PDF.");
        }
      }
    })();

    // Controls
    $("#reroll").addEventListener("click", async () => {
      const { min, max } = getActiveRange();
      await renderPage(randomInt(min, max));
    });
    $("#prev").addEventListener("click", async () => { await renderPage(current - 1); });
    $("#next").addEventListener("click", async () => { await renderPage(current + 1); });

    $("#applyRange").addEventListener("click", async () => {
      useInferredChk.checked = false;
      const { min, max } = getActiveRange();
      setRangeInputs(min, max);
      const u = new URL(location.href);
      u.searchParams.set("minPage", String(min));
      u.searchParams.set("maxPage", String(max));
      history.replaceState({}, "", u.toString());
      await renderPage(randomInt(min, max));
    });

    $("#resetToInferred").addEventListener("click", async () => {
      useInferredChk.checked = true;
      setRangeInputs(inferred.min, inferred.max);
      const u = new URL(location.href);
      u.searchParams.delete("minPage");
      u.searchParams.delete("maxPage");
      history.replaceState({}, "", u.toString());
      await renderPage(randomInt(inferred.min, inferred.max));
    });

    $("#applyZoom").addEventListener("click", async () => {
      const z = Number(zoomInput.value);
      if (Number.isFinite(z) && z >= 0.2 && z <= 3) {
        zoom = z;
        await renderPage(current);
      }
    });

    addEventListener("resize", (() => {
      let t; return () => { clearTimeout(t); t = setTimeout(() => { if (pdf) renderPage(current); }, 150); };
    })());
  </script>
</body>
</html>
